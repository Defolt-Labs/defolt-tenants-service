# defolt-tenants-service: Tier 1 shared tenant registry. Fronts the
# fleet-wide multi-tenant SaaS story per MULTI_TENANT_PLAN.md §5.1.
name: defolt-tenants-service
namespace: defolt-platform

image:
  repository: registry.uat.defoltlabs.com/defolt-tenants-service
  tag: latest

port: 8080

env:
  SERVER_PORT: "8080"
  DB_HOST: defolt-postgres
  DB_PORT: "5432"
  DB_NAME: defolt_tenants
  DB_USER: defolt_tenants
  DB_SSLMODE: disable
  NATS_URL: nats://defolt-nats:4222
  REDIS_URL: redis://defolt-redis:6379
  AUTO_MIGRATE: "true"
  # Comma-separated list of slugs the registry refuses to allocate.
  # Reserved to avoid collisions with fleet-internal subdomains.
  RESERVED_SLUGS: "www,api,admin,staff,ci,grafana,docs,tempo,loki,mail,webmail,billing,tenants,drs,mt,uat"
  DEFOLT_IDENTITY_URL: http://defolt-identity-service:8080
  DEFOLT_BILLING_URL: http://defolt-billing-service:8080

envFile:
  enabled: true
  secretName: platform-env

# Plan §5.13: 3 replicas + PodDisruptionBudget = minAvailable 2. HA
# is load-bearing because every subdomain resolution hits this service.
autoscaling:
  enabled: false
replicas: 3

pdb:
  enabled: true
  minAvailable: 2

# The service serves at root (landing "/", "/public/*.html", "/api/v1/*"),
# and the signup page posts to its own origin, so a stripped /tenants prefix
# would break its fetches. defolt.api is a shared path-multiplexed host, so
# publish the public surface unstripped instead of claiming "/". Notably this
# leaves /internal/resolve-host unroutable from outside, which server.go
# relies on: it is deliberately unauthenticated.
ingress:
  host: defolt.api.uat.defoltlabs.com
  stripPrefix: false
  paths:
    - /public
    - /api/v1

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 256Mi
