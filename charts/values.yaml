# defolt-tenants-service: Tier 1 shared tenant registry. Fronts the
# fleet-wide multi-tenant SaaS story per MULTI_TENANT_PLAN.md §5.1.
name: defolt-tenants-service
namespace: defolt-platform

image:
  repository: registry.uat.defoltlabs.com/defolt-tenants-service
  tag: latest

port: 8080

env:
  # SERVICE_VERSION is what GET /health answers with, and it is the only
  # honest way to tell "the fix is deployed" from "the tag changed" — a
  # rolled-back or half-rolled deployment carries a new image tag and the
  # old binary. The chart had never set it, so every environment reported
  # config.go's default of v0.1.0 and the field said nothing at all.
  #
  # v0.2.0: the internal POST /tenants route carries owner_user_id onto the
  # tenant, refuses a health tenant that names no owner, and tenant.activated
  # carries the inbound request id.
  SERVICE_VERSION: "v0.2.0"
  SERVER_PORT: "8080"
  DB_HOST: defolt-postgres
  DB_PORT: "5432"
  DB_NAME: defolt_tenants
  DB_USER: defolt_tenants
  DB_SSLMODE: disable
  NATS_URL: nats://defolt-nats:4222
  REDIS_URL: redis://defolt-redis:6379
  AUTO_MIGRATE: "true"
  # Comma-separated list of slugs the registry refuses to allocate.
  # Reserved to avoid collisions with fleet-internal subdomains.
  #
  # Grown 2026-08-15 for §5.10, and the ordering there is deliberate: the
  # list must be wide BEFORE the `*.shop.defoltlabs.com` wildcard route
  # goes live. Until then a slug is only ever a path segment; afterwards
  # it is a real hostname, so `api` or `www` would let a tenant claim a
  # name adjacent to real infrastructure.
  #
  # Added: app, shop, staging, secrets, s3, registry, vps -- every other
  # label that already resolves under defoltlabs.com, checked against the
  # live certificate list on both clusters rather than recalled.
  #
  # Existing tenants were audited against the additions first (§5.10
  # step 3 says a tenant already holding a now-reserved slug must be
  # migrated, not broken): 13 on UAT, 1 on prod, none holding any of
  # them, so nothing had to move. `defolt` is deliberately NOT reserved
  # -- a live UAT tenant holds it.
  RESERVED_SLUGS: "www,api,app,admin,staff,ci,grafana,docs,tempo,loki,mail,webmail,billing,tenants,drs,mt,uat,shop,staging,secrets,s3,registry,vps"
  DEFOLT_IDENTITY_URL: http://defolt-identity-service:8080
  DEFOLT_BILLING_URL: http://defolt-billing-service:8080
  # The DNS root every CUSTOMER-FACING host hangs off. Per-product host
  # shapes are in service/product.go (ProductHome): a DRS store is
  # <slug>.shop.<root>, a DHS clinic is dhs.<root>. This is only the root
  # they share, so a new environment is one value and not a URL per
  # product per service.
  #
  # It replaces TENANT_BASE_DOMAIN, which was set to
  # `mt.drs.uat.defoltlabs.com` and read by no Go code in this repo at
  # all. `mt.` is the legacy multi-tenant apex and must never reach
  # anything a customer sees, so a dead value naming it was a loaded gun
  # for whoever wired it up next.
  PUBLIC_ROOT_DOMAIN: uat.defoltlabs.com

envFile:
  enabled: true
  secretName: platform-env

# Plan §5.13: 3 replicas + PodDisruptionBudget = minAvailable 2. HA
# is load-bearing because every subdomain resolution hits this service.
autoscaling:
  enabled: false
replicas: 3

pdb:
  enabled: true
  minAvailable: 2

# Paths stay unstripped because defolt.api is a shared path-multiplexed host
# and callers hit the anonymous endpoints at their full paths. The verified
# cstaging rebuild (2026-07-21) routes /public as well as /api/v1, so both
# are published here. Notably this leaves /internal/resolve-host unroutable
# from outside, which server.go relies on: it is deliberately unauthenticated.
ingress:
  # WP-SEC4 H2. Renders a Traefik IngressRoute instead of a k8s Ingress so the
  # routing rule can carry !PathRegexp(`^/[^/]+/api/v1/internal`), the exclusion
  # DHS and DRS have always had. Without it this host answered 401 to an
  # anonymous internet request for /api/v1/internal/... — measured on
  # 2026-09-11 — which with the fleet's one shared internal key was a single
  # header away from 200. Needs chart >= 0.7.0 on the deploy host.
  excludeInternalPaths: true
  # defolt.api has never carried HSTS, frameDeny, nosniff or a referrer policy,
  # where dhs.api and drs.api have carried all four for months (measured
  # 2026-09-11, against defolt-website's untouched Ingress too, so this predates
  # the IngressRoute swap). Chart 0.8.0 attaches them. No CORS header is set —
  # this service pins its own allow-list.
  securityHeaders: true
  # tenants publishes /api/v1 UNSTRIPPED, so its internal routes sit at
  # /api/v1/internal/... with no service segment in front and the fleet regex
  # cannot match them. This adds the shape that does.
  extraExcludes:
    - "^/api/v1/internal"
  host: defolt.api.uat.defoltlabs.com
  stripPrefix: false
  paths:
    - /public
    - /api/v1
  # Chart 0.5.0: shared-host cert. Every defolt.api.uat route must reference
  # the same TLS secret or Traefik serves the default cert on this host.
  tls:
    secretName: defolt-api-uat-tls

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    cpu: "500m"
    memory: 256Mi
