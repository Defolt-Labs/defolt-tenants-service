when:
  - event: push
    branch: staging
  - event: tag

steps:
  - name: test
    # Runs on push AND tag, deliberately. Every other Go step in this
    # file is gated on `event: push`, so a production tag skips them --
    # which means this is the only check a tagged release gets, and a
    # guard that a release can skip is not a guard.
    #
    # platformguard is the §9.1 coupling guard: it fails the build when a
    # declared identifier in this platform service names a concept that
    # belongs to one product's domain (till, sale, product, branch, sku,
    # patient, practitioner, bed, prescription). §9.1's audit found six of
    # seven platform services already clean; this is what keeps them that
    # way, because the audit was a snapshot and nothing was checking it.
    image: golang:1.25-alpine
    commands:
      - apk add --no-cache git
      - go mod download
      - go vet ./...
      - go test ./... -count=1

  - name: build-image
    when:
      event: push
    image: gcr.io/kaniko-project/executor:debug
    environment:
      REGISTRY_USER:
        from_secret: registry_username
      REGISTRY_PASS:
        from_secret: registry_password
    commands:
      - mkdir -p /kaniko/.docker
      - AUTH=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASS" | base64 -w0)
      - printf '{"auths":{"registry.uat.defoltlabs.com":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --dockerfile=Dockerfile --context=dir://. --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:${CI_PIPELINE_NUMBER} --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:latest --cache=true --cache-repo=registry.uat.defoltlabs.com/cache/${CI_REPO_NAME} --cache-ttl=336h --digest-file=/kaniko/digest-file

  - name: upload-values
    when:
      event: push
    image: appleboy/drone-scp
    settings:
      host: { from_secret: server_host }
      username: devops
      key: { from_secret: ssh_key }
      source: charts/values.yaml
      target: /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}
      overwrite: true

  - name: deploy-uat
    when:
      event: push
    image: appleboy/drone-ssh
    settings:
      script_stop: true
      host: { from_secret: server_host }
      username: devops
      key: { from_secret: ssh_key }
      script:
        - export KUBECONFIG=/home/devops/.kube/config
        - helm upgrade --install ${CI_REPO_NAME} /opt/defolt/charts/defolt-service
            --namespace defolt-platform
            --create-namespace
            --values /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}/charts/values.yaml
            --set image.tag=${CI_PIPELINE_NUMBER}
            --wait --timeout 3m
        - rm -rf /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}

  - name: build-image-prod
    when:
      event: tag
    image: gcr.io/kaniko-project/executor:debug
    environment:
      REGISTRY_USER:
        from_secret: registry_username
      REGISTRY_PASS:
        from_secret: registry_password
    commands:
      - mkdir -p /kaniko/.docker
      - AUTH=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASS" | base64 -w0)
      - printf '{"auths":{"registry.uat.defoltlabs.com":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --dockerfile=Dockerfile --context=dir://. --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:${CI_COMMIT_TAG} --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:prod --cache=true --cache-repo=registry.uat.defoltlabs.com/cache/${CI_REPO_NAME} --cache-ttl=336h --digest-file=/kaniko/digest-file

  # === PRODUCTION: promote image, deploy on tag ===
  - name: upload-prod-values
    image: appleboy/drone-scp
    when:
      event: tag
    settings:
      host: { from_secret: prod_server_host }
      username: devops
      key: { from_secret: prod_ssh_key }
      source: charts/values.yaml
      target: /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}
      overwrite: true

  # charts/values.yaml is the UAT file, so anything environment-specific has
  # to be overridden here. TENANT_BASE_DOMAIN is overridden for honesty, not
  # for effect: measured 2026-08-15, no Go code in this service reads it
  # (config.go never calls getStr("TENANT_BASE_DOMAIN")), so the UAT value
  # sitting on production was misleading rather than broken. Do not add
  # behaviour that depends on it without re-checking that.
  # RESERVED_SLUGS still carries the UAT list; growing it is §5.10's work and
  # it needs comma escaping in --set.
  - name: deploy-prod
    image: appleboy/drone-ssh
    when:
      event: tag
    settings:
      script_stop: true
      host: { from_secret: prod_server_host }
      username: devops
      key: { from_secret: prod_ssh_key }
      script:
        - export KUBECONFIG=/home/devops/.kube/config
        - helm upgrade --install ${CI_REPO_NAME} /opt/defolt/charts/defolt-service
            --namespace defolt-platform
            --create-namespace
            --values /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}/charts/values.yaml
            --set image.tag=${CI_COMMIT_TAG}
            --set ingress.host=defolt.api.defoltlabs.com
            --set ingress.tls.secretName=defolt-api-tls
            --set env.TENANT_BASE_DOMAIN=drs.defoltlabs.com
            --wait --timeout 3m
        - rm -rf /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}

