# A tag runs only on the in-cluster agent with production credentials.
labels:
  release: "${CI_COMMIT_TAG}"

when:
  - event: push
    branch: staging
  - event: tag

steps:
  - name: test
    image: golang:1.26-alpine
    environment:
      # Modules come from Athens at goproxy.uat.defoltlabs.com (org secret goproxy_url); it serves the private kits.
      GOPROXY:
        from_secret: goproxy_url
      GONOSUMDB: "github.com/Defolt-Labs/*"
    commands:
      - apk add --no-cache git
      - go mod download
      - go vet ./...
      - go test ./... -count=1

  - name: build-image
    when:
      event: push
    image: gcr.io/kaniko-project/executor:debug
    environment:
      REGISTRY_USER:
        from_secret: registry_username
      REGISTRY_PASS:
        from_secret: registry_password
      # Private kits come through Athens; the build-arg carries the creds URL, with the public proxy as fallback.
      GOPROXY_URL:
        from_secret: goproxy_url
    commands:
      - mkdir -p /kaniko/.docker
      - AUTH=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASS" | base64 -w0)
      - printf '{"auths":{"registry.uat.defoltlabs.com":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --dockerfile=Dockerfile --context=dir://. --build-arg GOPROXY="$GOPROXY_URL|https://proxy.golang.org|direct" --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:${CI_PIPELINE_NUMBER} --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:latest --cache=true --cache-repo=registry.uat.defoltlabs.com/cache/${CI_REPO_NAME} --cache-ttl=336h --digest-file=/kaniko/digest-file

  - name: upload-values
    when:
      event: push
    image: appleboy/drone-scp
    settings:
      host: { from_secret: server_host }
      username: devops
      key: { from_secret: ssh_key }
      source: values.yaml
      target: /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}
      overwrite: true

  - name: deploy-uat
    when:
      event: push
    image: appleboy/drone-ssh
    settings:
      script_stop: true
      host: { from_secret: server_host }
      username: devops
      key: { from_secret: ssh_key }
      script:
        - export KUBECONFIG=/home/devops/.kube/config
        - helm upgrade --install ${CI_REPO_NAME} /opt/defolt/charts/defolt-service
            --namespace defolt-platform
            --create-namespace
            --values /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}/values.yaml
            --set image.tag=${CI_PIPELINE_NUMBER}
            --wait --timeout 3m
        - rm -rf /tmp/${CI_REPO_NAME}-${CI_PIPELINE_NUMBER}

  - name: build-image-prod
    when:
      event: tag
    image: gcr.io/kaniko-project/executor:debug
    environment:
      REGISTRY_USER:
        from_secret: registry_username
      REGISTRY_PASS:
        from_secret: registry_password
      # Private kits come through Athens; the build-arg carries the creds URL, with the public proxy as fallback.
      GOPROXY_URL:
        from_secret: goproxy_url
    commands:
      - mkdir -p /kaniko/.docker
      - AUTH=$(printf "%s:%s" "$REGISTRY_USER" "$REGISTRY_PASS" | base64 -w0)
      - printf '{"auths":{"registry.uat.defoltlabs.com":{"auth":"%s"}}}' "$AUTH" > /kaniko/.docker/config.json
      - >-
        /kaniko/executor --dockerfile=Dockerfile --context=dir://. --build-arg GOPROXY="$GOPROXY_URL|https://proxy.golang.org|direct" --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:${CI_COMMIT_TAG} --destination=registry.uat.defoltlabs.com/${CI_REPO_NAME}:prod --cache=true --cache-repo=registry.uat.defoltlabs.com/cache/${CI_REPO_NAME} --cache-ttl=336h --digest-file=/kaniko/digest-file

  - name: upload-prod-values
    image: appleboy/drone-scp
    when:
      event: tag
    settings:
      host: { from_secret: prod_server_host }
      username: devops
      key: { from_secret: prod_ssh_key }
      source: values.yaml
      target: /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}
      overwrite: true

  - name: deploy-prod
    image: appleboy/drone-ssh
    when:
      event: tag
    settings:
      script_stop: true
      host: { from_secret: prod_server_host }
      username: devops
      key: { from_secret: prod_ssh_key }
      script:
        - export KUBECONFIG=/home/devops/.kube/config
        - helm upgrade --install ${CI_REPO_NAME} /opt/defolt/charts/defolt-service
            --namespace defolt-platform
            --create-namespace
            --values /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}/values.yaml
            --set image.tag=${CI_COMMIT_TAG}
            --set ingress.host=defolt.api.defoltlabs.com
            --set ingress.tls.secretName=defolt-api-tls
            --set env.TENANT_BASE_DOMAIN=drs.defoltlabs.com
            --wait --timeout 3m
        - rm -rf /tmp/${CI_REPO_NAME}-${CI_COMMIT_TAG}
