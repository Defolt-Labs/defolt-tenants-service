<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Store suspended</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1021;
    color: #e6e8f0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 16px; }
  p { color: #9aa1b5; line-height: 1.6; margin-bottom: 28px; }
  a.cta {
    display: inline-block;
    color: #eb5d1e;
    text-decoration: none;
    font-weight: 600;
    border: 1px solid #eb5d1e;
    border-radius: 8px;
    padding: 10px 22px;
  }
  a.cta:hover { background: #eb5d1e; color: #0b1021; }
</style>
</head>
<body>
<main>
  <h1>Store suspended</h1>
  <p>This store is temporarily suspended. If you are the owner, settle the outstanding invoice to reactivate.</p>
  <!-- Base domain substituted at serve time (handler injectPageConfig),
       so a UAT deploy links to the UAT apex instead of production. -->
  <a class="cta" href="https://__TENANT_BASE_DOMAIN__">Go to __TENANT_BASE_DOMAIN__</a>
</main>
</body>
</html>
